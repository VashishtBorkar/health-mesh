[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthmesh"
version = "0.1.0"
description = "Local-first personal health data platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "platformdirs>=4.3,<5",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["healthmesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
